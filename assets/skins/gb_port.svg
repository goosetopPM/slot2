<!--
  The front trim around the cart slot on a Game Boy shelf, drawn for SLOT2 in 2026 as a
  geometric redraw: no manufacturer artwork, drawing or photograph was traced or copied, and
  there is no logo or wordmark in the file. Angular side blocks with a small circular fastener
  each are what tells it from the other six at shelf distance.

  White coverage on transparency, like every cart drawing here: `ShelfView` rasterises it,
  uploads it once and tints it with the machine's lip colour. Its middle is deliberately empty
  — that is the opening the cartridge stands in — so only the two 20px trims either side paint.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 58">
  <g fill="#fff">
    <path d="M 0 6 L 18 6 L 18 28 L 12 28 L 12 52 L 0 52 Z"/>
    <path d="M 294 6 L 276 6 L 276 28 L 282 28 L 282 52 L 294 52 Z"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2">
    <circle cx="15" cy="40" r="3"/>
    <circle cx="279" cy="40" r="3"/>
  </g>
</svg>
