<!--
  The front trim around the cart slot on a Super Nintendo shelf, drawn for SLOT2 in 2026 as a
  geometric redraw: no manufacturer artwork, drawing or photograph was traced or copied, and
  there is no logo or wordmark in the file. A rounded shoulder above a separate bottom corner
  rail on each side — two pieces with a gap between them — is what tells it from the other six.

  White coverage on transparency: `ShelfView` rasterises it, uploads it once and tints it with
  the machine's lip colour. The opening the cartridge stands in is the empty middle, which is
  why nothing is drawn across the mouth.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 58">
  <g fill="#fff">
    <path d="M 0 8 Q 18 8 18 28 L 18 32 L 0 32 Z"/>
    <rect x="0" y="46" width="14" height="6" rx="3"/>
    <path d="M 294 8 Q 276 8 276 28 L 276 32 L 294 32 Z"/>
    <rect x="280" y="46" width="14" height="6" rx="3"/>
  </g>
</svg>
