[package]
name = "slot2-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Logical buttons and axes, evdev reader, host key map, gestures (tap/hold/double-tap/chord)"

[features]
default = []
# Host key mapping needs winit's KeyCode. Off for the device build.
host = ["dep:winit"]

[dependencies]
winit = { version = "0.30", optional = true, default-features = false }
