name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Everything that runs on the host: format, both clippy configurations, the test suite.
  # GL tests skip themselves without SLOT2_GFX_TEST, so no display is needed.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # The core tests skip themselves when vendor/ is empty, which is right for a fresh
      # checkout and wrong for CI: a suite that silently tests nothing is worse than no
      # suite. So build the pinned cores natively for this runner — the same commits and
      # the same patches the device gets, only for x86_64 — and cache them on the pins, so
      # only a moved pin pays for it again.
      - name: cache cores
        id: cores
        uses: actions/cache@v4
        with:
          path: vendor
          key: cores-x86_64-${{ hashFiles('cores/**') }}
      - name: build cores
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential
          for c in mgba fceumm snes9x genesis_plus_gx; do
            echo "::group::$c"
            CROSS_TRIPLE= sh "cores/$c/build.sh" build "target-cores/$c" "vendor/${c}_libretro.so"
            echo "::endgroup::"
          done
      - name: cores present
        run: ls -l vendor/

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (host)
        run: cargo clippy --workspace --all-targets --features slot2-input/host -- -D warnings
      - name: clippy (device)
        run: cargo clippy -p slot2 -p slot2-gfx -p slot2-ui -p slot2-input --no-default-features --features slot2/device -- -D warnings
      - name: test
        run: cargo test --workspace --features slot2-input/host

      # The suite is allowed to skip a test it has no ROM for — the Game Boys, which need a
      # cartridge this repository may not carry. It is not allowed to skip one for want of
      # a core, because the cores are right there.
      - name: no core was skipped
        run: |
          cargo test -p slot2-retro --test cores -- --nocapture 2>&1 | tee /tmp/cores.log
          if grep -q "run build/cores.ps1" /tmp/cores.log; then
            echo "::error::a platform's core was missing, so its tests did not run"
            grep "run build/cores.ps1" /tmp/cores.log
            exit 1
          fi

  # The real thing: aarch64, glibc 2.31 floor, built in the same container developers use.
  device:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: build cross image
        run: docker build -t slot2-cross -f build/cross.Dockerfile build

      # Cores for the device are a separate build from the host ones above: same pins, same
      # patches, aarch64. Cached on the pins for the same reason.
      - name: cache device cores
        id: devcores
        uses: actions/cache@v4
        with:
          path: vendor
          key: cores-aarch64-${{ hashFiles('cores/**') }}
      - name: build device cores
        if: steps.devcores.outputs.cache-hit != 'true'
        run: |
          for c in mgba fceumm snes9x genesis_plus_gx; do
            echo "::group::$c"
            docker run --rm -v "$PWD:/src" -w /src slot2-cross \
              sh "cores/$c/build.sh" build "target-device/cores/$c" "vendor/${c}_libretro.so"
            echo "::endgroup::"
          done

      - name: cross build (profile device)
        run: |
          docker run --rm -v "$PWD:/src" -w /src slot2-cross \
            sh -c "cargo build --profile device --target aarch64-unknown-linux-gnu --target-dir target-device -p slot2 --no-default-features --features device \
                   && file target-device/aarch64-unknown-linux-gnu/device/slot2"

      # Kept in step with build/dist-device.ps1, which is what a developer runs. A tree
      # without cores boots to an empty shelf and looks like a bug, so this fails rather
      # than shipping one.
      - name: assemble card tree
        run: |
          out=dist-device
          mkdir -p "$out/System/Fonts" "$out/System/cores" "$out/System/licenses/fonts"
          cp target-device/aarch64-unknown-linux-gnu/device/slot2 "$out/System/frontend"
          cp assets/fonts/*.otf assets/fonts/*.ttf "$out/System/Fonts/"
          cp assets/fonts/*.txt "$out/System/licenses/fonts/"
          cp vendor/*_libretro.so "$out/System/cores/"
          cp vendor/*_libretro.so.meta "$out/System/licenses/"
          echo "SLOT2 $(git rev-parse --short HEAD) — copy the contents of this folder to the card root" > "$out/System/VERSION.txt"
          ls -lR "$out"
          test "$(ls "$out/System/cores" | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: slot2-device-${{ github.sha }}
          path: dist-device
          if-no-files-found: error
