name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Everything that runs on the host: format, both clippy configurations, the test suite.
  # GL tests skip themselves without SLOT2_GFX_TEST, so no display is needed.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      # cpal's ALSA backend compiles alsa-sys, which needs alsa.pc from libasound2-dev. This
      # step is unconditional on purpose: `build cores` is skipped once the core cache hits,
      # so a package installed there would be missing on exactly the run that hits.
      - name: host audio prerequisites (libasound2-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      # The core tests skip themselves when vendor/ is empty, which is right for a fresh
      # checkout and wrong for CI: a suite that silently tests nothing is worse than no
      # suite. So build the pinned cores natively for this runner — the same commits and
      # the same patches the device gets, only for x86_64 — and cache them on the pins, so
      # only a moved pin pays for it again. The list is cores/required.txt, the same manifest
      # the device build and the card assembly read.
      - name: cache cores
        id: cores
        uses: actions/cache@v4
        with:
          path: vendor
          key: cores-x86_64-${{ hashFiles('cores/**') }}
      - name: build cores
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential
          for c in $(tr -d '\r' < cores/required.txt); do
            echo "::group::$c"
            CROSS_TRIPLE= sh "cores/$c/build.sh" build "target-cores/$c" "vendor/${c}_libretro.so"
            echo "::endgroup::"
          done
      - name: cores present
        run: |
          missing=0
          for c in $(tr -d '\r' < cores/required.txt); do
            for f in "vendor/${c}_libretro.so" "vendor/${c}_libretro.so.meta"; do
              if [ ! -s "$f" ]; then echo "::error::missing or empty: $f"; missing=1; fi
            done
          done
          ls -l vendor/
          exit "$missing"

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (host)
        run: cargo clippy --workspace --all-targets --features slot2-input/host -- -D warnings
      - name: clippy (device)
        run: cargo clippy -p slot2 -p slot2-gfx -p slot2-ui -p slot2-input --no-default-features --features slot2/device -- -D warnings
      - name: test
        run: cargo test --workspace --features slot2-input/host

      # The suite is allowed to skip a test it has no ROM for — the Game Boys, which need a
      # cartridge this repository may not carry. It is not allowed to skip one for want of
      # a core, because the cores are right there.
      - name: no core was skipped
        run: |
          cargo test -p slot2-retro --test cores -- --nocapture 2>&1 | tee /tmp/cores.log
          if grep -q "run build/cores.ps1" /tmp/cores.log; then
            echo "::error::a platform's core was missing, so its tests did not run"
            grep "run build/cores.ps1" /tmp/cores.log
            exit 1
          fi

  # The same aarch64 card tree as before, now assembled by the one reusable workflow that the
  # tag release also calls, so a release ships exactly what CI built. The artifact keeps the
  # commit-based name main's runs already produce.
  device:
    needs: check
    uses: ./.github/workflows/device-artifact.yml
    with:
      artifact-name: slot2-device-${{ github.sha }}
